  let navEl=document.querySelector('.n-it[data-s="'+sid+'"]');

function update(){
  let total=SEC.length-1,doneCount=Object.keys(done).length,pct=total?Math.round(doneCount/total*100):0;
  document.getElementById('pFill').style.width=pct+'%';
  document.getElementById('pCount').textContent=doneCount+'/'+total;
  document.getElementById('ringPct').textContent=pct+'%';
  var ring=document.getElementById('ringFg');
  var circumference=283;
  var offset=circumference-(pct/100*circumference);
  ring.style.strokeDashoffset=offset;
  if(pct>=50)ring.style.stroke='var(--grn)';
  else if(pct>=25)ring.style.stroke='var(--cyn)';
  else ring.style.stroke='var(--grn)';

var termHist=[];
var termHistIdx=-1;

function termPrint(text,cls){
  var body=document.getElementById('termBody');
  var span=document.createElement('span');
  if(cls)span.className=cls;
  span.textContent=text;
  body.appendChild(span);
  body.appendChild(document.createTextNode('\n'));
  body.scrollTop=body.scrollHeight;
}

function termProcess(cmd){
  termPrint('$ '+cmd);
  var parts=cmd.trim().split(/\s+/);
  var c=parts[0].toLowerCase();
  var args=parts.slice(1).join(' ');
  if(!c)return;
  termHist.push(cmd);termHistIdx=termHist.length;
  if(c==='clear'){document.getElementById('termBody').innerHTML='';return}
  if(c==='history'){termHist.forEach(function(h,i){termPrint('  '+String(i+1).padStart(4)+' '+h)});return}
  if(TERM_CMDS[c]){
    var result=typeof TERM_CMDS[c]==='function'?TERM_CMDS[c](args):TERM_CMDS[c];
    if(result!==null&&result!==undefined)termPrint(result,'out');
  }else{
    termPrint('command not found: '+c+'. Type help for available commands.','err');
  }
}

function initTerminal(){
  var panel=document.getElementById('termPanel');
  var input=document.getElementById('termInput');
  var body=document.getElementById('termBody');
  var vw=window.visualViewport;
  var kbActive=false;
  var isMaximized=false;
  var savedStyles={};

  // --- Keyboard handling ---
  function adjustForKeyboard(){
    if(!panel.classList.contains('show'))return;
    if(vw){
      var availH=vw.height;
      var offset=window.innerHeight-availH;
      if(offset>100){
        if(!kbActive){kbActive=true;panel.classList.add('kb-active')}
      }else{
        if(kbActive){kbActive=false;panel.classList.remove('kb-active')}
        if(!isMaximized){panel.style.top='60px'}
      }
    }
    body.scrollTop=body.scrollHeight;
  }
  if(vw){vw.addEventListener('resize',adjustForKeyboard);vw.addEventListener('scroll',adjustForKeyboard)}

  // --- Drag ---
  var dragEl=document.getElementById('termDrag');
  var dragging=false,dragX=0,dragY=0;
  function onDragStart(e){
    if(isMaximized)return;
    e.preventDefault();
    dragging=true;
    var touch=e.touches?e.touches[0]:e;
    var rect=panel.getBoundingClientRect();
    dragX=touch.clientX-rect.left;
    dragY=touch.clientY-rect.top;
    panel.style.transition='none';
    document.addEventListener('mousemove',onDragMove);
    document.addEventListener('touchmove',onDragMove,{passive:false});
    document.addEventListener('mouseup',onDragEnd);
    document.addEventListener('touchend',onDragEnd);
  }
  function onDragMove(e){
    if(!dragging)return;
    e.preventDefault();
    var touch=e.touches?e.touches[0]:e;
    var x=touch.clientX-dragX;
    var y=touch.clientY-dragY;
    x=Math.max(0,Math.min(x,window.innerWidth-panel.offsetWidth));
    y=Math.max(0,Math.min(y,window.innerHeight-panel.offsetHeight));
    panel.style.left=x+'px';panel.style.top=y+'px';panel.style.right='auto';panel.style.bottom='auto';
  }
  function onDragEnd(){
    dragging=false;
    document.removeEventListener('mousemove',onDragMove);
    document.removeEventListener('touchmove',onDragMove);
    document.removeEventListener('mouseup',onDragEnd);
    document.removeEventListener('touchend',onDragEnd);
  }
  dragEl.addEventListener('mousedown',onDragStart);
  dragEl.addEventListener('touchstart',onDragStart,{passive:false});

  // --- Resize ---
  var resizeEl=document.getElementById('termResize');
  var resizing=false,rsX=0,rsY=0,rsW=0,rsH=0;
  function onResizeStart(e){
    if(isMaximized)return;
    e.preventDefault();e.stopPropagation();
    resizing=true;
    var touch=e.touches?e.touches[0]:e;
    rsX=touch.clientX;rsY=touch.clientY;
    rsW=panel.offsetWidth;rsH=panel.offsetHeight;
    panel.style.transition='none';
    document.addEventListener('mousemove',onResizeMove);
    document.addEventListener('touchmove',onResizeMove,{passive:false});
    document.addEventListener('mouseup',onResizeEnd);
    document.addEventListener('touchend',onResizeEnd);
  }
  function onResizeMove(e){
    if(!resizing)return;
    e.preventDefault();
    var touch=e.touches?e.touches[0]:e;
    var dw=touch.clientX-rsX;
    var dh=touch.clientY-rsY;
    panel.style.width=Math.max(260,rsW+dw)+'px';
    panel.style.height=Math.max(180,rsH+dh)+'px';
  }
  function onResizeEnd(){
    resizing=false;
    document.removeEventListener('mousemove',onResizeMove);
    document.removeEventListener('touchmove',onResizeMove);
    document.removeEventListener('mouseup',onResizeEnd);
    document.removeEventListener('touchend',onResizeEnd);
  }
  resizeEl.addEventListener('mousedown',onResizeStart);
  resizeEl.addEventListener('touchstart',onResizeStart,{passive:false});

  // --- Open / Close / Maximize ---
  function bringTermToFront(){
    window._panelZ=(window._panelZ||200)+1;
    panel.style.zIndex=window._panelZ;
  }
  panel.addEventListener('mousedown',bringTermToFront);
  panel.addEventListener('touchstart',bringTermToFront,{passive:true});
  function openTerminal(){
    panel.classList.remove('hide-anim');panel.classList.add('show');
    bringTermToFront();
    if(!body.hasChildNodes()){termPrint('Welcome to CyberSec Hub Terminal','hi');termPrint('Type "help" for available commands.\n','out')}
    setTimeout(function(){adjustForKeyboard();input.focus()},50);
  }
  function closeTerminal(){
    panel.classList.add('hide-anim');

      var b2=document.getElementById('termBody');if(b2)b2.style.display='';
      var il=panel.querySelector('.term-input-line');if(il)il.style.display='';

    }
    setTimeout(function(){panel.classList.remove('show','hide-anim','kb-active');panel.style.top='60px';panel.style.height='';panel.style.left='16px';panel.style.right='';panel.style.width=''},200);
  }
  var termMinimized=false;
  function toggleMinimize(){
    var body2=document.getElementById('termBody');
    var inputLine=panel.querySelector('.term-input-line');
    if(!termMinimized){
      if(body2)body2.style.display='none';

      termMinimized=false;
      document.getElementById('termMin').innerHTML='&#8722;';
      document.getElementById('termMin').title='Minimize';
    }
  }
  function toggleMaximize(){
    if(isMaximized){
      isMaximized=false;
      panel.classList.remove('maximized');
      if(savedStyles.cssText){panel.style.cssText=savedStyles.cssText}
      else{panel.style.cssText=''}

    }
  }

  document.getElementById('termTog').onclick=function(){if(panel.classList.contains('show'))closeTerminal();else openTerminal()};
  document.getElementById('termClose').onclick=closeTerminal;
  document.getElementById('termMin').onclick=toggleMinimize;
  document.getElementById('termMax').onclick=toggleMaximize;

  input.onkeydown=function(e){
    e.stopPropagation();
    if(e.key==='Enter'){var cmd=input.value;input.value='';termProcess(cmd)}
    if(e.key==='ArrowUp'){e.preventDefault();if(termHistIdx>0){termHistIdx--;input.value=termHist[termHistIdx]}}
    if(e.key==='ArrowDown'){e.preventDefault();if(termHistIdx<termHist.length-1){termHistIdx++;input.value=termHist[termHistIdx]}else{termHistIdx=termHist.length;input.value=''}}

  };

  window._openTerminal=openTerminal;
  window._closeTerminal=closeTerminal;
}

    if(!vEntry||!vEntry.vids.length){list.innerHTML='<div class="vid-empty" style="position:static;padding:20px">No videos available for this section</div>';return}
    var playIdx=0;
    if(vidId){var fi=vEntry.vids.findIndex(function(v){return v.vid===vidId});if(fi>=0)playIdx=fi}
    vEntry.vids.forEach(function(v,i){
      var item=document.createElement('div');
      item.className='vid-item'+(i===playIdx?' active':'');
      item.innerHTML='<span class="vi-play">&#9654;</span><div class="vi-info"><span class="vi-nam">'+v.ch+'</span><span class="vi-ch">YouTube</span></div>';
      item.addEventListener('click',function(){
        list.querySelectorAll('.vid-item').forEach(function(el){el.classList.remove('active')});
        item.classList.add('active');
        playVid(v.vid);
      });
      list.appendChild(item);
    });
    if(vEntry.vids.length>0){playVid(vEntry.vids[playIdx].vid)}
  }

  function playVid(vidId){
    placeholder.style.display='none';
    frame.style.display='block';
    frame.src='https://www.youtube-nocookie.com/embed/'+vidId+'?autoplay=1&rel=0&modestbranding=1';
    frame.onerror=function(){
      frame.style.display='none';
      placeholder.style.display='flex';
      placeholder.innerHTML='<div style="text-align:center"><div style="font-size:2rem;margin-bottom:8px">&#9654;</div><div>Playback blocked</div><a href="https://watch.youtube.com/watch?v='+vidId+'" target="_blank" style="color:var(--grn);font-size:.7rem;margin-top:8px;display:block">Open in YouTube &#8599;</a></div>';
    };
  }

  window._openVidPanel=function(secId,vidId){
    if(!panel.classList.contains('show')){panel.classList.remove('hide-anim');panel.classList.add('show')}
    bringToFront();
    loadVidList(secId,vidId);
  };
}

function initSync(){
  window._toast=toast;
  var panel=document.getElementById('syncPanel');
  var status=document.getElementById('syncStatus');
  var linkEl=document.getElementById('syncLink');
  var qrEl=document.getElementById('syncQR');

  document.getElementById('syncTrig').onclick=function(){
    panel.classList.add('show');
    generateSyncLink();
  };

  function generateSyncLink(){
    var data=JSON.stringify({d:JSON.parse(localStorage.getItem('cs_done')||'{}'),s:localStorage.getItem('cs_streak')||'0',t:localStorage.getItem('cs_current')||'home'});
    var encoded=btoa(unescape(encodeURIComponent(data)));
    var baseUrl=window.location.origin+window.location.pathname;
    var syncUrl=baseUrl+'#sync='+encoded;
    linkEl.textContent=syncUrl;
    linkEl.onclick=function(){navigator.clipboard.writeText(syncUrl).then(function(){toast('Sync link copied!','success','&#10003;')})};
    generateQR(syncUrl);
  }

  function generateQR(text){
    qrEl.innerHTML='';
    var size=160;
    var canvas=document.createElement('canvas');
    canvas.width=size;canvas.height=size;
    var ctx=canvas.getContext('2d');
    var qr=makeQR(text,size);
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#000';
    var moduleSize=qr.size>0?size/qr.size:4;
    for(var r=0;r<qr.size;r++){
      for(var c=0;c<qr.size;c++){
        if(qr.modules[r][c]){
          ctx.fillRect(c*moduleSize,r*moduleSize,moduleSize+0.5,moduleSize+0.5);
        }
      }
    }
    qrEl.appendChild(canvas);
  }

  function makeQR(text){
    var len=text.length;
    var size=len<50?25:len<100?30:len<200?35:40;
    var modules=[];
    for(var i=0;i<size;i++){modules[i]=[];for(var j=0;j<size;j++)modules[i][j]=false}
    for(var i=0;i<size;i++){modules[0][i]=true;modules[size-1][i]=true;modules[i][0]=true;modules[i][size-1]=true}
    for(var r=0;r<7;r++)for(var c=0;c<7;c++){
      if(r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4)){modules[r][c]=true}
      modules[r][size-7+c]=r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4);
      modules[size-7+r][c]=r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4);
    }
    for(var i=8;i<size-8;i++){modules[6][i]=i%2===0}
    var hash=0;
    for(var i=0;i<len;i++)hash=((hash<<5)-hash)+text.charCodeAt(i);
    for(var r=9;r<size-9;r++){
      for(var c=9;c<size-9;c++){
        if(Math.abs(hash%(r+c+1))<2)modules[r][c]=!modules[r][c];
        hash=((hash<<3)+hash)^(hash>>7);
      }
    }
    for(var i=0;i<len&&i<size*2;i++){
      var pos=8+(i*3)%(size-16);
      if(pos<size)modules[8][pos]=((text.charCodeAt(i%len)>>Math.floor(i/len))&1)===1;
    }
    return{size:size,modules:modules};
  }

  document.getElementById('syncExport').onclick=function(){
    var data={d:JSON.parse(localStorage.getItem('cs_done')||'{}'),s:localStorage.getItem('cs_streak')||'0',t:localStorage.getItem('cs_current')||'home',q:localStorage.getItem('cs_totalq')||'0',c:localStorage.getItem('cs_correctq')||'0',ts:Date.now()};
    var json=JSON.stringify(data);
    if(window.AndroidBridge){
      window.AndroidBridge.exportProgress(json);
      status.className='sync-status ok';status.textContent='Progress exported!';
    }else{
      navigator.clipboard.writeText(json).then(function(){
        status.className='sync-status ok';status.textContent='Progress copied to clipboard! Paste on other device.';
        toast('Progress exported!','success','&#10003;');
      }).catch(function(){
        var ta=document.createElement('textarea');ta.value=json;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
        status.className='sync-status ok';status.textContent='Progress exported!';
        toast('Progress exported!','success','&#10003;');
      });
    }
  };

  document.getElementById('syncImport').onclick=function(){
    function doImport(text){
      try{
        var data=JSON.parse(text);
        if(data.d){
          localStorage.setItem('cs_done',JSON.stringify(data.d));
          localStorage.setItem('cs_streak',data.s||'0');
          localStorage.setItem('cs_current',data.t||'home');
          if(data.q)localStorage.setItem('cs_totalq',data.q);
          if(data.c)localStorage.setItem('cs_correctq',data.c);
          status.className='sync-status ok';status.textContent='Progress imported! Reloading...';
          toast('Progress imported!','success','&#10003;');
          setTimeout(function(){location.reload()},1000);
        }else{
          status.className='sync-status err';status.textContent='Invalid progress data.';
        }
      }catch(e){
        status.className='sync-status err';status.textContent='Could not parse progress data.';
      }
    }
    if(window.AndroidBridge){
      var data=window.AndroidBridge.importProgress();
      if(data){doImport(data)}else{status.className='sync-status err';status.textContent='No progress data in clipboard.'}
    }else{
      navigator.clipboard.readText().then(function(text){
        if(text){doImport(text)}else{status.className='sync-status err';status.textContent='Clipboard is empty.'}
      }).catch(function(){
        status.className='sync-status err';status.textContent='Cannot read clipboard. Paste manually.';
      });
    }
  };

  if(window.location.hash&&window.location.hash.indexOf('#sync=')===0){
    try{
      var encoded=window.location.hash.substring(6);
      var json=decodeURIComponent(escape(atob(encoded)));
      var data=JSON.parse(json);
      if(data.d){
        localStorage.setItem('cs_done',JSON.stringify(data.d));
        localStorage.setItem('cs_streak',data.s||'0');
        localStorage.setItem('cs_current',data.t||'home');
        toast('Progress synced from link!','success','&#10003;');
        window.location.hash='';
        setTimeout(function(){location.reload()},1500);
      }
    }catch(e){}
  }
}

function initAnimations(){
  var canvas=document.getElementById('matrixBg');
  if(canvas){
    var ctx=canvas.getContext('2d');
    canvas.width=window.innerWidth;canvas.height=window.innerHeight;
    var cols=Math.floor(canvas.width/14);
    var drops=[];
    for(var i=0;i<cols;i++)drops[i]=Math.random()*-100;
    var chars='01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
    function drawMatrix(){
      ctx.fillStyle='rgba(10,13,13,0.05)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#4ade80';
      ctx.font='12px monospace';
      for(var i=0;i<drops.length;i++){
        var ch=chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(ch,i*14,drops[i]*14);
        if(drops[i]*14>canvas.height&&Math.random()>0.975)drops[i]=0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix,50);
    window.addEventListener('resize',function(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;cols=Math.floor(canvas.width/14);drops=[];for(var i=0;i<cols;i++)drops[i]=Math.random()*-100});
  }

  var sl=document.createElement('div');sl.className='scanline-overlay';document.body.appendChild(sl);

  var heroEl=document.querySelector('.boot-term .boot-line:last-child');
  if(heroEl){
    var fullText=heroEl.textContent;
    heroEl.textContent='';
    heroEl.style.visibility='visible';
    var charIdx=0;
    function typeChar(){
      if(charIdx<fullText.length){
        heroEl.textContent+=fullText[charIdx];
        charIdx++;
        setTimeout(typeChar,40+Math.random()*30);
      }
    }
    setTimeout(typeChar,600);
  }

  var statEls=document.querySelectorAll('.hs .sn');
  statEls.forEach(function(el){
    var raw=el.textContent.replace(/[^0-9]/g,'');
    var suffix=el.textContent.replace(/[0-9]/g,'');
    var target=parseInt(raw)||0;
    if(target===0)return;
    el.textContent='0'+suffix;
    var start=0;var dur=1200;var startTime=null;
    function animateCount(ts){
      if(!startTime)startTime=ts;
      var progress=Math.min((ts-startTime)/dur,1);
      var eased=1-Math.pow(1-progress,3);
      var current=Math.round(eased*target);
      el.textContent=current+suffix;
      if(progress<1)requestAnimationFrame(animateCount);
    }
    setTimeout(function(){requestAnimationFrame(animateCount)},400);
  });

  function observeReveals(sec){
    var els=sec.querySelectorAll('h2,h3,p,.ib,.activity,.quiz,.col,.cd,table,.tbox');
    els.forEach(function(el,i){el.classList.remove('visible');el.classList.add('reveal');el.style.transitionDelay=(Math.min(i*0.03,0.3))+'s'});
    var obs=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){if(entry.isIntersecting){entry.target.classList.add('visible');obs.unobserve(entry.target)}});
    },{threshold:0.1,rootMargin:'0px 0px -30px 0px'});
    els.forEach(function(el){obs.observe(el)});
  }

  var initSec=document.querySelector('.sc.vis');
  if(initSec)observeReveals(initSec);

  var origNav=window.S;
  window.S=function(sid){
    origNav(sid);
    setTimeout(function(){
      var sec=document.getElementById('sec-'+sid);
      if(sec)observeReveals(sec);
    },50);
  };

  document.addEventListener('mousemove',function(e){
    var cards=document.querySelectorAll('.cd:hover,.hs:hover');
    cards.forEach(function(card){
      var rect=card.getBoundingClientRect();
      var x=e.clientX-rect.left;
      var y=e.clientY-rect.top;
      var cx=rect.width/2;
      var cy=rect.height/2;
      var rotateX=(y-cy)/cy*-4;
      var rotateY=(x-cx)/cx*4;
      card.style.transform='perspective(600px) rotateX('+rotateX+'deg) rotateY('+rotateY+'deg) translateY(-3px)';
    });
  });
  document.querySelectorAll('.cd,.hs').forEach(function(card){
    card.addEventListener('mouseleave',function(){card.style.transform=''});
  });

  document.querySelectorAll('.tb-btn,.n-ch,.sb-home,.q-opt,.bn-item').forEach(function(el){
    el.classList.add('ripple');
    el.addEventListener('click',function(e){
      var rect=el.getBoundingClientRect();
      var x=e.clientX-rect.left;
      var y=e.clientY-rect.top;
      var span=document.createElement('span');
      span.style.left=x+'px';span.style.top=y+'px';
      el.appendChild(span);
      setTimeout(function(){span.remove()},600);
    });
  });

  window._spawnConfetti=function(x,y){
    var colors=['#4ade80','#38bdf8','#c084fc','#facc15','#f97316','#f472b6'];
    for(var i=0;i<20;i++){
      var p=document.createElement('div');
      p.className='confetti-piece';
      p.style.left=(x+Math.random()*60-30)+'px';
      p.style.top=y+'px';
      p.style.background=colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDuration=(1.5+Math.random()*1.5)+'s';
      p.style.width=(4+Math.random()*8)+'px';
      p.style.height=(4+Math.random()*8)+'px';
      document.body.appendChild(p);
      setTimeout(function(){p.remove()},3000);
    }
  };

  var cw=document.getElementById('cw');
  var topbar=document.querySelector('.topbar');
  if(cw&&topbar){
    cw.addEventListener('scroll',function(){
      var scrolled=cw.scrollTop>20;
      topbar.style.background=scrolled?'rgba(10,13,13,.95)':'rgba(10,13,13,.9)';
      topbar.style.boxShadow=scrolled?'0 2px 20px rgba(0,0,0,.3)':'none';
    });
  }
}
