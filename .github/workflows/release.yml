name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (EXE installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build index.html from sources
        shell: bash
        run: cat shell_top.html sections.html shell_bot.html > index.html

      - name: Generate app icon
        shell: bash
        run: node electron/generate-icon.js

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages (NSIS + portable)
        shell: bash
        run: |
          set +e
          npx electron-builder --win --publish never --config.win.target=nsis --config.win.signAndEditExecutable=false > nsis.log 2>&1
          nsis_rc=$?
          npx electron-builder --win --publish never --config.win.target=zip --config.win.signAndEditExecutable=false > zip.log 2>&1
          zip_rc=$?
          set -e
          if [ $nsis_rc -ne 0 ]; then
            echo "::error::NSIS build failed (rc=$nsis_rc)"
            tail -20 nsis.log | sed 's/^/::error::/'
          else
            echo "NSIS build OK"
          fi
          if [ $zip_rc -ne 0 ]; then
            echo "::error::ZIP build failed (rc=$zip_rc)"
            tail -20 zip.log | sed 's/^/::error::/'
          else
            echo "ZIP build OK"
          fi
          if [ $nsis_rc -ne 0 ] && [ $zip_rc -ne 0 ]; then
            echo "::error::Both Windows targets failed"
            exit 1
          fi

      - name: Upload Windows build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            nsis.log
            zip.log
            release/builder-debug.yml
          retention-days: 7

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/
          retention-days: 1

  build-linux:
    name: Linux (AppImage + DEB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: System deps for Electron
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libpango-1.0-0 libcairo2 libasound2t64 fuse3 || \
          sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libpango-1.0-0 libcairo2 libasound2 fuse

      - name: Build index.html from sources
        run: cat shell_top.html sections.html shell_bot.html > index.html

      - name: Generate app icon
        run: node electron/generate-icon.js

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/
          retention-days: 1

  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android/cmdline-tools
          curl -sL 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip' \
            -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $HOME/android/cmdline-tools/
          mv $HOME/android/cmdline-tools/cmdline-tools $HOME/android/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV
          echo "$HOME/android/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install SDK components
        run: |
          yes | sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5

      - name: Add build tools to PATH
        run: |
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Prepare android.jar
        run: |
          mkdir -p android/toolz
          cp "$ANDROID_HOME/platforms/android-34/android.jar" android/toolz/android.jar

      - name: Build index.html from sources
        run: cat shell_top.html sections.html shell_bot.html > index.html

      - name: Copy assets
        run: |
          cp index.html android/assets/
          cp manifest.json android/assets/
          cp sw.js android/assets/

      - name: Build APK
        run: bash build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/CyberSecHub.apk
          retention-days: 1

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: find . -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            windows/**/*.exe
            windows/**/*.zip
            linux/**/*.AppImage
            linux/**/*.deb
            android/CyberSecHub.apk
          generate_release_notes: true
